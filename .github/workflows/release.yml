name: Release

# Push a tag that matches a CHANGELOG.md section to publish a release:
#   git tag v0.1.0 && git push origin v0.1.0
# Tags with a suffix (v0.2.0-beta.1) are published as prereleases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Extract CHANGELOG section
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: notes
          path: notes.md

  macos:
    name: macOS app (universal)
    needs: notes
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: swift test
      - name: Build
        # Info.plist versions must be numeric: v0.2.0-beta.1 → 0.2.0.
        run: |
          version="${GITHUB_REF_NAME#v}"
          VERSION="${version%%-*}" ARCHS="arm64 x86_64" scripts/build-app.sh
      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/NonSleep.app "dist/NonSleep-${GITHUB_REF_NAME#v}-macOS.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos
          path: dist/*

  linux:
    name: Linux CLI (${{ matrix.arch }})
    needs: notes
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Jammy's glibc (2.35) keeps the binary runnable on older distributions.
    container: swift:6.3-jammy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test
        run: swift test
      - name: Build (Swift runtime linked statically)
        run: swift build -c release --product nonsleep --static-swift-stdlib
      - name: Package
        run: |
          name="nonsleep-${GITHUB_REF_NAME#v}-linux-${{ matrix.arch }}"
          mkdir -p "$name" dist
          cp "$(swift build -c release --show-bin-path)/nonsleep" "$name/"
          strip "$name/nonsleep"
          cp scripts/install-linux.sh "$name/install.sh"
          cp scripts/uninstall-linux.sh "$name/uninstall.sh"
          cp LICENSE README.md "$name/"
          tar -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  publish:
    name: Publish GitHub release
    needs: [notes, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir dist
          find artifacts -type f ! -name notes.md -exec mv {} dist/ \;
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'dist/*'
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "NonSleep $GITHUB_REF_NAME" \
            --notes-file artifacts/notes/notes.md \
            --verify-tag $prerelease
