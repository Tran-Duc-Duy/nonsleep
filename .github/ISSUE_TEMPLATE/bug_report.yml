name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security problems go through private reporting instead — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: "`nonsleep status` output"
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: App log (if the menu bar app is involved)
      description: "`log show --last 30m --predicate 'subsystem == \"dev.nonsleep.app\"'`"
      render: text
  - type: input
    id: version
    attributes:
      label: NonSleep version
      placeholder: "0.1.0 (About in the app, or the release you downloaded)"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.5, MacBook Air M3"
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Which agent were you running?
      multiple: true
      options: [omp, Claude Code, Cursor, Antigravity, Orca, other / none]
